{% extends "layout.html" %}

{% block content %}
<div class="auth-page-wrapper {{ 'admin-theme' if user_type == 'Admin' else 'conductor-theme' }}">
    <div class="auth-card-container">
        <!-- Decoration Elements -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        
        <div class="auth-box glass-effect animate-up">
            <div class="auth-header">
                <div class="auth-icon-circle">
                    {% if user_type == 'Admin' %}
                        <i class="fas fa-user-plus"></i>
                    {% else %}
                        <i class="fas fa-user-tag"></i>
                    {% endif %}
                </div>
                <h2>{{ user_type }} Registration</h2>
                <p>Join the QTravix smart network</p>
            </div>
            
            <form method="POST" class="auth-form">
                <div class="form-group-modern">
                    <label>{{ user_type }} ID</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" name="{{ user_type.lower() }}_id" autocomplete="username" required placeholder="Ex: {{ 'ADMIN01' if user_type == 'Admin' else 'COND01' }}">
                    </div>
                </div>

                {% if user_type == 'Conductor' %}
                <div class="form-group-modern">
                    <label>Assigned Admin ID</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="admin_id" required placeholder="Ex: ADMIN01">
                    </div>
                </div>
                {% endif %}

                <div class="form-group-modern">
                    <label>Staff Email</label>

                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" autocomplete="email" required placeholder="staff@qtravix.com">
                    </div>
                </div>
                
                <div class="form-group-modern">
                    <label>Security Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" autocomplete="new-password" required placeholder="••••••••">
                        <i class="fas fa-eye toggle-password" id="togglePassword" style="position: absolute; right: 1.25rem; cursor: pointer; color: #94a3b8; transition: color 0.3s ease;"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn-modern">
                    <span>Create Account</span>
                    <i class="fas fa-user-check"></i>
                </button>
            </form>
            
            <script>
                const togglePassword = document.querySelector('#togglePassword');
                const password = document.querySelector('#password');

                togglePassword.addEventListener('click', function (e) {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    this.classList.toggle('fa-eye-slash');
                    this.classList.toggle('fa-eye');
                    if (type === 'text') {
                        this.style.color = 'var(--accent)';
                    } else {
                        this.style.color = '#94a3b8';
                    }
                });
            </script>
            
            <div class="auth-footer">
                <p>Already have an account? 
                   <a href="{{ url_for(user_type.lower() + '_login') }}">Login Portal</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
